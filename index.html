<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Registro de ecografías</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="xlsx.full.min.js"></script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ecografías">
<meta name="theme-color" content="#EDF0F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<style>
:root{
  --bg:#EDF0F2; --surface:#FFFFFF; --surface-2:#F5F7F8; --ink:#16202A; --muted:#5A6773; --line:#D6DCE1;
  --g-lo:#2B3137; --g-hi:#CDD3D8; --red:#C22F39; --blue:#2356B0; --ok:#1E7549; --warn:#9A5800;
  --focus:#2356B0; --shadow:0 1px 2px rgba(22,32,42,.06);
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#000000; --surface:#111418; --surface-2:#1A1F25; --ink:#E4E9ED; --muted:#96A3AE; --line:#2A333C;
    --g-lo:#3A4148; --g-hi:#CDD3D8; --red:#E25560; --blue:#6390E4; --ok:#4CC08A; --warn:#E3A74A; --focus:#6390E4;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#111418; --surface-2:#1A1F25; --ink:#E4E9ED; --muted:#96A3AE; --line:#2A333C;
  --g-lo:#3A4148; --g-hi:#CDD3D8; --red:#E25560; --blue:#6390E4; --ok:#4CC08A; --warn:#E3A74A; --focus:#6390E4;
  --shadow:none; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding:18px 18px 64px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:12px}
.probe{width:34px;height:34px;border-radius:9px;background:
  conic-gradient(from 210deg at 50% 100%, transparent 0 0, var(--g-lo) 0 60deg, transparent 60deg 360deg);
  position:relative;overflow:hidden;border:1px solid var(--line);background-color:var(--surface)}
.probe::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(255,255,255,.18) 36%,transparent 38%,transparent 60%,rgba(255,255,255,.12) 61%,transparent 63%)}
.brand h1{font-size:21px;font-weight:700;letter-spacing:-.01em;margin:0;line-height:1.1}
.brand small{display:block;color:var(--muted);font-size:13px;font-weight:500}
nav.tabs{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
nav.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:7px;cursor:pointer;font-weight:600;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--ink);color:var(--surface)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-weight:500;font-size:14px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--surface)}
.chip.add{border-style:dashed;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:7px;box-shadow:var(--shadow)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn.ghost{background:transparent;box-shadow:none}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}
.panel h2{font-size:16px;margin:0 0 12px;font-weight:700}
.panel h3{font-size:14px;margin:18px 0 8px;font-weight:700}
.monthnav{display:flex;align-items:center;gap:6px}
.monthnav strong{min-width:150px;text-align:center;font-size:17px}
.iconbtn{border:1px solid var(--line);background:var(--surface);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:16px;line-height:1}
.hero{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin:6px 0 16px}
.big{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1}
.big-label{color:var(--muted);font-size:13px;font-weight:500;margin-top:4px}
.money{font-size:28px;font-weight:700;letter-spacing:-.02em;text-align:right;line-height:1.1}
.split{height:14px;border-radius:4px;display:flex;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.split .g{background:linear-gradient(90deg,var(--g-lo),var(--g-hi))}
.split .d{background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%)}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--muted)}
.sw{display:inline-block;width:18px;height:10px;border-radius:2px;vertical-align:-1px;margin-right:6px}
.sw.g{background:linear-gradient(90deg,var(--g-lo),var(--g-hi))}
.sw.d{background:linear-gradient(90deg,var(--red) 0 50%,var(--blue) 50% 100%)}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);font-size:13px}
td.num,th.num{text-align:right}
tr.group td{font-weight:700;background:var(--surface-2);border-bottom:1px solid var(--line)}
tr.total td{font-weight:700;border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
tr.current td{background:color-mix(in srgb,var(--blue) 8%,transparent)}
.warn{color:var(--warn);font-size:13px;font-weight:500}
.note{color:var(--muted);font-size:13px}
.empty{text-align:center;padding:36px 12px;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.day{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--surface);margin-bottom:10px}
.day-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.day-title{font-weight:700;font-size:16px}
.tag{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:6px;padding:1px 7px;margin-left:8px;color:var(--muted);vertical-align:1px}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.pill{font-size:13px;padding:3px 9px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line)}
.pill.d{border-left:4px solid var(--red);box-shadow:inset 3px 0 0 var(--blue)}
.pill.g{border-left:4px solid var(--g-lo)}
.day-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.month-sep{margin:22px 0 10px;font-size:14px;font-weight:700;color:var(--muted)}
.grp-head{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:14px 0 6px}
.exrow{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.exrow:last-child{border-bottom:0}
.exname{font-size:14px}
.exname small{display:block;color:var(--muted);font-size:12px}
.stepper{display:flex;align-items:center;gap:4px}
.stepper button{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:18px;line-height:1}
.stepper input{width:54px;height:34px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.stepper input.has{border-color:var(--ink);font-weight:700}
.price{width:130px;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-align:right}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.field input[type=text],.field input[type=date],.field select,.field textarea{width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.field textarea{height:auto;min-height:220px;padding:10px;font-size:13px;line-height:1.45;resize:vertical}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:0 28px}
.overlay{position:fixed;inset:0;background:rgba(10,14,18,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 12px 24px;overflow-y:auto;z-index:20}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:640px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal.wide{max-width:860px}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:12px}
.modal-head h2{margin:0;font-size:18px}
.modal-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:16px;flex-wrap:wrap;position:sticky;bottom:-20px;background:var(--surface);padding:12px 0 4px;border-top:1px solid var(--line)}
.modal-foot .sum{font-weight:700}
.info{background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;z-index:40;max-width:92vw}
.toast.err{background:var(--red);color:#fff}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg label{padding:6px 12px;cursor:pointer;font-size:14px;font-weight:500}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--ink);color:var(--surface)}
.seg label:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:-2px}
select.map{height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);max-width:260px}
select.map.none{border-color:var(--warn)}
@media (max-width:720px){
  .cols2,.row2,.row3{grid-template-columns:1fr}
  .hero{grid-template-columns:1fr}
  .money{text-align:left}
  .big{font-size:38px}
  nav.tabs{width:100%}
  nav.tabs button{flex:1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.appicon{width:36px;height:36px;border-radius:9px;display:block}
.status{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font-weight:500;text-align:left}
span.status{cursor:default}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.dot.local{background:var(--warn)}
.dot.err{background:var(--red)}
.dot.busy{background:var(--blue);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.3}}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:color-mix(in srgb,var(--blue) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--blue) 35%,var(--line));border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.sel{height:36px;border:1px solid var(--line);border-radius:9px;background:var(--surface);padding:0 10px;min-width:200px}
.sel.sm{min-width:140px}
.txt{flex:1;width:100%;height:38px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
td:first-child{white-space:normal}
.rt{text-align:right}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;margin-top:4px}
.check input{width:18px;height:18px}
.tasas{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tasas label{display:flex;align-items:center;gap:6px;font-size:14px}
.tasas span{width:40px;color:var(--muted)}
.tasas input{width:62px;height:32px;border:1px solid var(--line);border-radius:7px;background:var(--surface);text-align:right;padding:0 6px}
details.how{margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--surface-2)}
details.how summary{cursor:pointer;font-weight:600;font-size:14px}
details.how ol{padding-left:20px;font-size:14px}
details.how li{margin:6px 0}
code{font-size:13px;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:0 4px}
nav.tabs button{padding:7px 11px}
@media (max-width:720px){nav.tabs button{padding:7px 4px;font-size:13px}.rt{text-align:left}}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="note">Cargando…</p></div>
<div id="modalRoot"></div>
<script>
"use strict";

/* ---------- Catálogo ---------- */
const EXAMS=[
 {id:'abd',g:'gris',n:'Abdominal',s:'Abdominal'},
 {id:'renal',g:'gris',n:'Renal',s:'Renal'},
 {id:'pelv',g:'gris',n:'Pelviana masculina/femenina',s:'Pelviana'},
 {id:'tir',g:'gris',n:'Tiroides / región cervical',s:'Tiroides/cervical'},
 {id:'pb',g:'gris',n:'Partes blandas / musculoesquelética',s:'PB/MSK'},
 {id:'enc',g:'gris',n:'Encefálica',s:'Encefálica'},
 {id:'abpp',g:'gris',n:'Abdominopelviana pediátrica',s:'Abd-pelv ped'},
 {id:'test',g:'gris',n:'Testicular',s:'Testicular'},
 {id:'dcerv',g:'doppler',n:'Doppler cervical',s:'D cervical'},
 {id:'dven1',g:'doppler',n:'Doppler venoso, una extremidad',s:'D venoso 1 ext'},
 {id:'dven2',g:'doppler',n:'Doppler venoso, ambas extremidades',s:'D venoso 2 ext'},
 {id:'dart1',g:'doppler',n:'Doppler arterial, una extremidad',s:'D arterial 1 ext'},
 {id:'dart2',g:'doppler',n:'Doppler arterial, ambas extremidades',s:'D arterial 2 ext'},
 {id:'dren',g:'doppler',n:'Doppler renal',s:'D renal'},
 {id:'dhep',g:'doppler',n:'Doppler hepático',s:'D hepático'},
 {id:'dtest',g:'doppler',n:'Doppler testicular',s:'D testicular'}
];
const EX=Object.fromEntries(EXAMS.map(e=>[e.id,e]));
const GRIS=EXAMS.filter(e=>e.g==='gris'), DOP=EXAMS.filter(e=>e.g==='doppler');

/* ---------- Utilidades ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clpFmt=new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
const money=n=>clpFmt.format(Math.round(n||0));
const intFmt=new Intl.NumberFormat('es-CL');
const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const newId=()=>Math.random().toString(36).slice(2,10);
function isoToDate(iso){const[y,m,d]=iso.split('-').map(Number);return new Date(y,m-1,d);}
function dayTitle(iso){const d=isoToDate(iso);return cap(`${DIAS[d.getDay()]} ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}`);}
function shortDay(iso){const d=isoToDate(iso);return `${cap(DIAS[d.getDay()].slice(0,3))} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;}
function monthLabel(ym){const[y,m]=ym.split('-').map(Number);return cap(`${MESES[m-1]} ${y}`);}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function shiftYM(ym,k){let[y,m]=ym.split('-').map(Number);m+=k;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return `${y}-${pad(m)}`;}
function validISO(y,m,d){if(!(y>1990&&y<2100&&m>=1&&m<=12&&d>=1&&d<=31))return null;const t=new Date(y,m-1,d);if(t.getMonth()!==m-1)return null;return `${y}-${pad(m)}-${pad(d)}`;}
function parseDate(v){
  if(v==null||v==='')return null;
  if(v instanceof Date&&!isNaN(v))return validISO(v.getFullYear(),v.getMonth()+1,v.getDate());
  if(typeof v==='number'){
    if(v>20000&&v<80000&&window.XLSX){const p=XLSX.SSF.parse_date_code(v);return p?validISO(p.y,p.m,p.d):null;}
    return null;
  }
  const s=String(v).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return validISO(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})/))){let y=+m[3];if(y<100)y+=2000;return validISO(y,+m[2],+m[1]);}
  if(/^\d{5}(\.\d+)?$/.test(s))return parseDate(Number(s));
  return null;
}
function toNum(v){if(typeof v==='number')return v;const s=String(v??'').replace(/\s/g,'').replace(/\./g,'').replace(',','.');const n=parseFloat(s);return isFinite(n)?n:NaN;}
function norm(s){return String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}

/* ---------- Reconocimiento de ecografías ---------- */
function recognize(raw){
  const s=' '+norm(raw)+' ';
  if(!s.trim())return null;
  if(/\b(tc|tac|tomografia computada|scanner|rm|rnm|resonancia|rx|radiografia|mamografia|pet|densitometria|angiotc)\b/.test(s))return null;
  const dop=/doppler|duplex|eco ?color|\bcolor\b/.test(s);
  const una=/unilateral|\bunica\b|\buna\b|derech|izquierd|\beid\b|\beii\b|\besd\b|\besi\b|\bmid\b|\bmii\b|\bmsd\b|\bmsi\b/.test(s);
  const extrem=una&&/\be[is][di]\b|\bm[is][di]\b|extremidad|miembro|pierna|brazo/.test(s)||/extremidad|\beeii\b|\beess\b|\bmmii\b|\bmmss\b|miembro|pierna|brazo|\binferior|\bsuperior/.test(s);
  const ambos=!una&&/ambas|bilateral|extremidades|\beeii\b|\beess\b|\bmmii\b|\bmmss\b|miembros|piernas|brazos|inferiores|superiores/.test(s);
  const ven=/venos|\btvp\b|trombosis venosa|varic|safen/.test(s);
  const art=/arteri|isquemi|claudica/.test(s);
  if(dop||((ven||art)&&extrem)){
    if(/testic|escrot|varicocele|torsion/.test(s))return 'dtest';
    if(/cervic|carot|cuello|vertebral|supraaort|\btsa\b/.test(s))return 'dcerv';
    if(extrem||((ven||art)&&!/renal|rinon|hepat|portal|higado/.test(s))){
      if(art&&!ven)return ambos?'dart2':'dart1';
      return ambos?'dven2':'dven1';
    }
    if(/renal|rinon|trasplante/.test(s))return 'dren';
    if(/hepat|portal|higado|\btips\b|esplenoportal/.test(s))return 'dhep';
    return null;
  }
  if(/testic|escrot/.test(s))return 'test';
  if(/abdominopelvi|abdomino pelvi|abdomen y pelvis|abdominal y pelvi/.test(s))return 'abpp';
  if(/encefal|cerebral|transfontan|cerebro|craneal/.test(s))return 'enc';
  if(/pared abdominal|hernia|inguinal|partes blandas|musculo|\bmsk\b|osteoart|hombro|rodilla|tobillo|codo|muneca|\bmano\b|cadera|\bpie\b|tendon|tendin|ligament|subcutane|lipoma/.test(s))return 'pb';
  if(/tiroid|paratiroid|cervical|cuello|parotid|salival|submandibular/.test(s))return 'tir';
  if(/pelvi|ginecolog|transvaginal|endovaginal|utero|ovari|prostat|transrectal/.test(s))return 'pelv';
  if(/renal|rinon|renovesical|vesical|vias urinarias|urinari/.test(s))return 'renal';
  if(/abdom|hepat|higado|vesicula|biliar|pancrea|bazo|esplen/.test(s))return 'abd';
  return null;
}

const TASAS_DEF={2020:10.75,2021:11.5,2022:12.25,2023:13,2024:13.75,2025:14.5,2026:15.25,2027:16,2028:17};
const MSK=[
 {id:'hombro',n:'Hombro'},{id:'codo',n:'Codo'},{id:'mano',n:'Muñeca y mano'},{id:'cadera',n:'Cadera e ingle'},
 {id:'rodilla',n:'Rodilla'},{id:'pie',n:'Tobillo y pie'},{id:'musculo',n:'Músculo (desgarro, hematoma)'},
 {id:'pared',n:'Pared abdominal y hernias'},{id:'superf',n:'Partes blandas superficiales (lesiones, colecciones)'}
];
const INICIO='2000-01-01';
const pct=n=>`${String(Math.round(n*100)/100).replace('.',',')}%`;
const hFmt=h=>`${String(Math.round(h*10)/10).replace('.',',')} h`;
function parseHours(v){const n=parseFloat(String(v??'').replace(',','.'));return isFinite(n)&&n>0?Math.round(n*100)/100:0;}
function fechaCorta(iso){if(iso===INICIO)return 'el inicio';const d=isoToDate(iso);return `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;}
function shiftDay(iso,k){const d=isoToDate(iso);d.setDate(d.getDate()+k);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}

/* ---------- Almacenamiento local ---------- */
function cleanCounts(c){const o={};for(const[k,v]of Object.entries(c||{})){const n=Math.round(Number(v));if(EX[k]&&n>0)o[k]=n;}return o;}
function cleanMsk(m){const o={};for(const[k,v]of Object.entries(m||{})){const n=Math.round(Number(v));if(MSK.some(x=>x.id===k)&&n>0)o[k]=n;}return o;}
function normCentro(c){
  const x=clone(c);
  if(!Array.isArray(x.tarifas)||!x.tarifas.length)x.tarifas=[{desde:INICIO,precios:x.precios||{}}];
  delete x.precios;
  x.tarifas.forEach(t=>{if(!t.precios)t.precios={};});
  x.tarifas.sort((a,b)=>a.desde<b.desde?-1:a.desde>b.desde?1:0);
  if(x.boleta===undefined)x.boleta=true;
  return x;
}
const LS_KEY='ecos.v2';
const Store={
  recs:{},pending:{},cursor:0,
  settings:{url:'',token:'',device:'',lastSync:0,theme:'auto'},
  centros:[],alias:{},days:[],tasas:{...TASAS_DEF},dayMap:{},
  load(){
    try{const r=localStorage.getItem(LS_KEY);if(r){const d=JSON.parse(r);this.recs=d.recs||{};this.pending=d.pending||{};this.cursor=d.cursor||0;Object.assign(this.settings,d.settings||{});}else this.migrateV1();}
    catch(e){console.warn(e)}
    if(!this.settings.device)this.settings.device=newId()+newId();
    this.rebuild();this.persist();
  },
  migrateV1(){let d=null;try{d=JSON.parse(localStorage.getItem('ecos.v1')||'null');}catch(e){}if(d)this.importLegacy(d);},
  importLegacy(d){
    (d.config?.centros||[]).forEach((c,i)=>this.upsert('c:'+c.id,'centro',normCentro({id:c.id,nombre:c.nombre,precios:c.precios||{},orden:i})));
    this.rebuild();
    for(const m of Object.values(d.meses||{}))for(const[k,c]of Object.entries(m.entries||{})){const i=k.indexOf('_');this.setDay(k.slice(0,i),k.slice(i+1),c);}
    for(const[k,v]of Object.entries(d.config?.alias||{}))this.setAlias(k,v);
  },
  persist(){try{localStorage.setItem(LS_KEY,JSON.stringify({recs:this.recs,pending:this.pending,cursor:this.cursor,settings:this.settings}));}catch(e){toast('No se pudo guardar en este dispositivo','err')}},
  upsert(id,t,data,del=false){const prev=this.recs[id];const u=Math.max(Date.now(),prev?prev.u+1:0);this.recs[id]={id,t,d:del?null:clone(data),u,x:del?1:0};this.pending[id]=1;},
  tomb(id){const r=this.recs[id];if(r&&!r.x)this.upsert(id,r.t,null,true);},
  rebuild(){
    const C=[],A={},base={},sumas={};let tasas={...TASAS_DEF};
    for(const r of Object.values(this.recs)){
      if(r.x||!r.d)continue;
      if(r.t==='centro')C.push(normCentro(r.d));
      else if(r.t==='alias')A[r.d.k]=r.d.v;
      else if(r.t==='dia')base[r.d.cid+'_'+r.d.date]=r.d;
      else if(r.t==='suma'){const k=r.d.cid+'_'+r.d.date;(sumas[k]=sumas[k]||[]).push(r);}
      else if(r.t==='config'&&r.id==='cfg:ret'&&r.d.tasas)tasas={...TASAS_DEF,...r.d.tasas};
    }
    const map={};
    for(const k of new Set([...Object.keys(base),...Object.keys(sumas)])){
      const b=base[k],ss=sumas[k]||[];
      const i=k.indexOf('_');const cid=k.slice(0,i),date=k.slice(i+1);
      const counts={...(b?.counts||{})};
      ss.forEach(s=>{for(const[e,n]of Object.entries(s.d.counts||{}))if(EX[e])counts[e]=(counts[e]||0)+Number(n);});
      map[k]={cid,date,counts,horas:b?.horas||0,msk:b?.msk||{},sumas:ss.map(s=>s.id)};
    }
    C.sort((a,b)=>(a.orden??0)-(b.orden??0)||String(a.nombre).localeCompare(b.nombre));
    this.centros=C;this.alias=A;this.tasas=tasas;this.dayMap=map;
    this.days=Object.values(map).filter(d=>Object.keys(d.counts).length||d.horas).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  },
  commit(){this.rebuild();this.persist();safeRender();Sync.soon();},
  dayId:(cid,date)=>'d:'+cid+'_'+date,
  getDay(cid,date){return this.dayMap[cid+'_'+date]||null;},
  get(cid,date){const d=this.getDay(cid,date);return d&&Object.keys(d.counts).length?d.counts:null;},
  setDay(cid,date,counts,extra){
    const prev=this.getDay(cid,date);
    const c=cleanCounts(counts);
    const horas=extra&&'horas' in extra?parseHours(extra.horas):(prev?.horas||0);
    let msk=cleanMsk(extra&&'msk' in extra?extra.msk:(prev?.msk||{}));
    if(Object.values(msk).reduce((a,b)=>a+b,0)>(c.pb||0))msk={};
    const id=this.dayId(cid,date);
    if(Object.keys(c).length||horas){const d={cid,date,counts:c};if(horas)d.horas=horas;if(Object.keys(msk).length)d.msk=msk;this.upsert(id,'dia',d);}
    else this.tomb(id);
    (prev?.sumas||[]).forEach(s=>this.tomb(s));
    this.rebuild();
  },
  saveCenter(c){this.upsert('c:'+c.id,'centro',normCentro(c));},
  deleteCenter(cid){this.tomb('c:'+cid);Object.values(this.dayMap).filter(d=>d.cid===cid).forEach(d=>{this.tomb(this.dayId(cid,d.date));d.sumas.forEach(s=>this.tomb(s));});},
  setAlias(k,v){this.upsert('a:'+k,'alias',{k,v});},
  delAlias(k){this.tomb('a:'+k);},
  setTasas(t){this.upsert('cfg:ret','config',{tasas:t});},
  wipe(){Object.keys(this.recs).forEach(id=>this.tomb(id));},
  entries(){return this.days;},
  backupData(){return{app:'ecografias',version:3,exportado:new Date().toISOString(),recs:Object.values(this.recs).filter(r=>!r.x).map(r=>({id:r.id,t:r.t,d:r.d}))};},
  restore(d,mode){
    if(mode==='reemplazar')this.wipe();
    if(Array.isArray(d.recs)){d.recs.forEach(r=>{if(r&&r.id&&r.t&&r.d)this.upsert(r.id,r.t,r.t==='centro'?normCentro(r.d):r.d);});}
    else this.importLegacy(d);
  }
};
const centro=id=>Store.centros.find(c=>c.id===id);

/* ---------- Sincronización ---------- */
const Sync={
  busy:false,again:false,timer:null,state:'idle',err:'',
  configured(){return !!(Store.settings.url&&Store.settings.token);},
  soon(delay=2500){if(!this.configured())return;clearTimeout(this.timer);this.timer=setTimeout(()=>this.run(false),delay);},
  async call(body){
    const r=await fetch(Store.settings.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...body,token:Store.settings.token}),redirect:'follow'});
    if(!r.ok)throw new Error('respuesta '+r.status);
    let j;try{j=await r.json();}catch(e){throw new Error('la dirección no corresponde a la app');}
    if(!j.ok)throw new Error(j.error||'error desconocido');
    return j;
  },
  async run(manual){
    if(!this.configured()){if(manual)toast('Configura la sincronización en Ajustes','err');return;}
    if(this.busy){this.again=true;return;}
    if(!navigator.onLine){this.state='offline';renderStatus();if(manual)toast('Sin conexión: los cambios se subirán cuando vuelva internet','err');return;}
    this.busy=true;this.state='syncing';renderStatus();
    try{
      const ids=Object.keys(Store.pending);
      const changes=ids.map(id=>Store.recs[id]).filter(Boolean);
      const sentU={};changes.forEach(c=>sentU[c.id]=c.u);
      const j=await this.call({action:'sync',since:Store.cursor,changes,device:Store.settings.device,version:APP_VERSION});
      ids.forEach(id=>{if(!Store.recs[id]||Store.recs[id].u===sentU[id])delete Store.pending[id];});
      let changed=false;
      (j.records||[]).forEach(r=>{
        const l=Store.recs[r.id];
        if(l&&Store.pending[r.id]&&l.u>r.u)return;
        if(!l||r.u>l.u||(r.u===l.u&&(l.x!==(r.x?1:0)))){Store.recs[r.id]={id:r.id,t:r.t,d:r.d,u:r.u,x:r.x?1:0};changed=true;}
      });
      Store.cursor=j.cursor||0;Store.settings.lastSync=Date.now();
      Store.rebuild();Store.persist();
      this.state='ok';this.err='';
      if(changed)safeRender();else renderStatus();
      if(manual)toast(changed?'Sincronizado: hay datos nuevos':'Sincronizado');
    }catch(e){
      this.state='error';this.err=e.message||String(e);renderStatus();
      if(manual)toast('No se pudo sincronizar: '+this.err,'err');
    }finally{
      this.busy=false;
      if(this.again||(Object.keys(Store.pending).length&&this.state==='ok')){this.again=false;if(Object.keys(Store.pending).length)this.soon(1500);}
    }
  },
  async ping(url,token){
    const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'ping',token}),redirect:'follow'});
    let j;try{j=await r.json();}catch(e){throw new Error('la dirección no responde como la app (¿termina en /exec?)');}
    if(!j.ok)throw new Error(j.error||'error');
    if(j.app!=='ecografias')throw new Error('esa dirección es de otra app');
    return j;
  }
};

/* ---------- Tarifas, retención y cálculos ---------- */
function tarifaIdx(c,date){let i=0;c.tarifas.forEach((t,j)=>{if(t.desde<=date)i=j;});return i;}
function priceOf(cid,eid,date){const c=centro(cid);if(!c)return null;const t=c.tarifas[tarifaIdx(c,date||todayISO())];const v=t.precios[eid];return(typeof v==='number'&&isFinite(v))?v:null;}
function tasaAnio(y){const T=Store.tasas;const ys=Object.keys(T).map(Number).sort((a,b)=>a-b);if(!ys.length)return 0;if(T[y]!=null)return Number(T[y]);if(y>ys[ys.length-1])return Number(T[ys[ys.length-1]]);if(y<ys[0])return Number(T[ys[0]]);let v=T[ys[0]];ys.forEach(k=>{if(k<=y)v=T[k];});return Number(v);}
function retRate(cid,date){const c=centro(cid);if(!c||c.boleta===false)return 0;return tasaAnio(+date.slice(0,4))/100;}
function newAcc(){return{gris:0,dop:0,total:0,bruto:0,ret:0,liq:0,sinValor:0,horas:0,hEco:0,hLiq:0,dates:new Set(),rates:new Set(),ex:{},msk:{}};}
function addEntry(A,e){
  const rate=retRate(e.cid,e.date);let eb=0,et=0;
  for(const[k,n]of Object.entries(e.counts)){
    const ex=EX[k];if(!ex)continue;
    if(ex.g==='gris')A.gris+=n;else A.dop+=n;et+=n;
    const x=A.ex[k]||(A.ex[k]={n:0,bruto:0,ret:0,liq:0,miss:0,prices:new Set()});x.n+=n;
    const p=priceOf(e.cid,k,e.date);
    if(p==null){A.sinValor+=n;x.miss+=n;}else{const b=p*n;x.bruto+=b;x.ret+=b*rate;x.liq+=b*(1-rate);x.prices.add(p);eb+=b;}
  }
  A.total+=et;A.bruto+=eb;A.ret+=eb*rate;A.liq+=eb*(1-rate);
  if(eb)A.rates.add(rate);
  A.dates.add(e.date);
  if(e.horas){A.horas+=e.horas;A.hEco+=et;A.hLiq+=eb*(1-rate);}
  for(const[k,n]of Object.entries(e.msk||{}))A.msk[k]=(A.msk[k]||0)+n;
}
function summarize(list){const T=newAcc(),by={};list.forEach(e=>{addEntry(T,e);addEntry(by[e.cid]||(by[e.cid]=newAcc()),e);});return{T,by};}
function entryCalc(e){const A=newAcc();addEntry(A,e);return A;}
function rateLabel(A){if(A.rates.size===1){const r=[...A.rates][0];return r?`retención ${pct(r*100)}`:'sin retención';}return 'retención';}
function validEntries(){return Store.entries().filter(e=>centro(e.cid));}
function detailText(counts){return EXAMS.filter(e=>counts[e.id]).map(e=>`${e.s} ${counts[e.id]}`).join(', ');}
const perH=(a,h)=>String(Math.round(a/h*10)/10).replace('.',',');
function prodHTML(A){if(!A.horas)return '';return `<span>${hFmt(A.horas)} · <b>${perH(A.hEco,A.horas)}</b> eco/h · <b>${money(A.hLiq/A.horas)}</b> líquido/h</span>`;}

function monthsWithData(){return [...new Set(validEntries().map(e=>e.date.slice(0,7)))].sort();}
function casuList(){
  const yms=monthsWithData();
  let from=ui.caFrom&&yms.includes(ui.caFrom)?ui.caFrom:yms[0]||'',to=ui.caTo&&yms.includes(ui.caTo)?ui.caTo:yms[yms.length-1]||'';
  if(from>to)[from,to]=[to,from];
  const list=validEntries().filter(e=>{const ym=e.date.slice(0,7);return(ui.caCid==='all'||e.cid===ui.caCid)&&ym>=from&&ym<=to;});
  return{yms,from,to,list};
}
function casuData(list){
  const A=summarize(list).T;
  const years={};list.forEach(e=>{const y=e.date.slice(0,4);const Y=years[y]||(years[y]={gris:0,dop:0,dias:new Set()});Y.dias.add(e.date);for(const[k,n]of Object.entries(e.counts))EX[k].g==='gris'?Y.gris+=n:Y.dop+=n;});
  const mskTot=Object.values(A.msk).reduce((a,b)=>a+b,0);const pb=A.ex.pb?.n||0;
  return{A,years,mskTot,pb};
}

function openRegistro(cid,date,editing){

function regCounts(){const o={};EXAMS.forEach(ex=>{const v=parseInt($(`#regForm [name="${ex.id}"]`).value,10);if(v>0)o[ex.id]=v;});return o;}
function regMsk(){const o={};MSK.forEach(m=>{const v=parseInt($(`#regForm [name="m_${m.id}"]`).value,10);if(v>0)o[m.id]=v;});return o;}
function loadRegCounts(initial){
  const cid=$('#regC').value,date=$('#regD').value;
  const isOrig=reg.orig&&reg.orig.cid===cid&&reg.orig.date===date;
  const existing=date?Store.getDay(cid,date):null;
  if(initial||!reg.orig){
    EXAMS.forEach(ex=>{$(`#regForm [name="${ex.id}"]`).value=existing?.counts?.[ex.id]||0;});
    MSK.forEach(m=>{$(`#regForm [name="m_${m.id}"]`).value=existing?.msk?.[m.id]||0;});
    $('#regH').value=existing?.horas?String(existing.horas).replace('.',','):'';
    if(existing&&Object.keys(existing.msk||{}).length)$('#mskBox').open=true;
  }
  EXAMS.forEach(ex=>{const p=priceOf(cid,ex.id,date||todayISO());$(`[data-price="${ex.id}"]`).textContent=p==null?'Sin valor':`${money(p)} bruto`;});
  const info=$('#regInfo');
  if(!date){info.textContent='Elige una fecha.';}
  else if(reg.orig&&!isOrig&&existing){info.innerHTML=`<b>${dayTitle(date)}</b> ya tiene registros en este centro: al guardar se sumarán.`;}
  else if(!reg.orig&&existing){info.innerHTML=`<b>${dayTitle(date)}</b> · ya tenía registros; estás editándolos.`;}
  else info.innerHTML=`<b>${dayTitle(date)}</b>`;
  updRegSum();
}
function updRegSum(){
  const cid=$('#regC').value,date=$('#regD').value||todayISO();const counts=regCounts();
  const s=entryCalc({cid,date,counts,horas:0,msk:{}});
  $('#regSum').textContent=`${s.total} eco (${s.gris} grises · ${s.dop} Doppler) · ${money(s.liq)} líquido`;
  EXAMS.forEach(ex=>{const i=$(`#regForm [name="${ex.id}"]`);i.classList.toggle('has',parseInt(i.value,10)>0);});
  MSK.forEach(m=>{const i=$(`#regForm [name="m_${m.id}"]`);i.classList.toggle('has',parseInt(i.value,10)>0);});
  const mt=Object.values(regMsk()).reduce((a,b)=>a+b,0),pb=counts.pb||0;
  const over=mt>pb;
  $('#mskNote').innerHTML=over?`<span class="warn">Las regiones suman ${mt} y registraste ${pb} de partes blandas / MSK</span>`:pb?`(${mt} de ${pb} con región)`:'(opcional, para tu casuística)';
  $('#regSave').disabled=over;
}
function saveRegistro(){
  const cid=$('#regC').value,date=$('#regD').value;if(!date){toast('Elige una fecha','err');return;}
  const counts=regCounts(),msk=regMsk(),horas=parseHours($('#regH').value);
  if(reg.orig&&(reg.orig.cid!==cid||reg.orig.date!==date)){
    const ex=Store.getDay(cid,date);
    if(ex){for(const[k,n]of Object.entries(ex.counts))counts[k]=(counts[k]||0)+n;for(const[k,n]of Object.entries(ex.msk||{}))msk[k]=(msk[k]||0)+n;}
    Store.setDay(reg.orig.cid,reg.orig.date,{},{horas:0,msk:{}});
    Store.setDay(cid,date,counts,{horas:horas+(ex?.horas||0),msk});
  }else Store.setDay(cid,date,counts,{horas,msk});
  closeModal();ui.ym=date.slice(0,7);if(ui.diasYm!=='all')ui.diasYm=date.slice(0,7);Store.commit();
  toast(Object.keys(cleanCounts(counts)).length||horas?`Guardado: ${dayTitle(date)}`:'Día sin ecografías: se eliminó el registro');
}

function exportSel(){let a=$('#exFrom').value,b=$('#exTo').value;if(a>b)[a,b]=[b,a];return selFor(a,b,$('#exC').value);}
function selFor(a,b,cid){

  const period=a===b?monthLabel(a):`${monthLabel(a)} a ${monthLabel(b)}`;

function buildMessage(sel,mode){
  const{T,by}=summarize(sel.list);const cids=Object.keys(by);const L=[];const liq=mode!=='bruto';
  L.push(`Ecografías — ${sel.period}`);
  if(sel.cid!=='all')L.push(`Centro: ${centro(sel.cid).nombre}`);
  cids.forEach(cid=>{
    const b=by[cid];
    L.push('');if(sel.cid==='all')L.push(`▸ ${centro(cid).nombre}`);
    for(const[g,lab]of[['gris','Escala de grises'],['doppler','Doppler']]){
      const rs=EXAMS.filter(e=>e.g===g&&b.ex[e.id]);if(!rs.length)continue;
      L.push(`${lab} (${g==='gris'?b.gris:b.dop}):`);
      rs.forEach(e=>{const x=b.ex[e.id];
        if(x.miss&&!x.bruto){L.push(`• ${e.n}: ${x.n} (sin valor)`);return;}
        const unit=x.prices.size===1?[...x.prices][0]:null;
        L.push(liq?`• ${e.n}: ${x.n} → ${money(x.liq)} líquido`:`• ${e.n}: ${x.n}${unit!=null?` × ${money(unit)}`:''} = ${money(x.bruto)}`);});
    }
    L.push(`Total: ${b.total} ecografías · ${b.dates.size} ${b.dates.size===1?'día':'días'}${b.horas?` · ${hFmt(b.horas)}`:''}`);
    L.push(`Bruto ${money(b.bruto)} · ${rateLabel(b)} ${money(b.ret)} · Líquido ${money(b.liq)}`);
  });
  if(cids.length>1){L.push('');L.push(`TOTAL GENERAL: ${T.total} ecografías (${T.gris} grises, ${T.dop} Doppler)`);L.push(`Bruto ${money(T.bruto)} · ${rateLabel(T)} ${money(T.ret)} · Líquido ${money(T.liq)}`);}
  if(T.sinValor)L.push(`(${T.sinValor} sin valor definido, no incluidas en los montos)`);
  L.push('');L.push(`Desglose por día (${liq?'líquido':'bruto'})`);
  sel.list.forEach(e=>{const s=entryCalc(e);L.push(`• ${shortDay(e.date)}${sel.cid==='all'&&cids.length>1?` [${centro(e.cid).nombre}]`:''}${e.horas?` (${hFmt(e.horas)})`:''}: ${detailText(e.counts)} → ${s.total} · ${money(liq?s.liq:s.bruto)}`);});
  return L.join('\n');
}
function splitGD(list,cid){const sg=newAcc(),sd=newAcc();list.filter(e=>e.cid===cid).forEach(e=>{const cg={},cd={};for(const[k,n]of Object.entries(e.counts))(EX[k].g==='gris'?cg:cd)[k]=n;addEntry(sg,{...e,counts:cg,horas:0,msk:{}});addEntry(sd,{...e,counts:cd,horas:0,msk:{}});});return[sg,sd];}
function buildWorkbook(sel){

        put([g==='gris'?'Grises':'Doppler',e.n,x.n,unit,x.bruto||'',x.bruto?x.ret:'',x.bruto?x.liq:''],[3,4,5,6]);});

    put([]);
  });
  if(cids.length>1){put(['TOTAL GENERAL','',T.total,'',T.bruto,T.ret,T.liq],[4,5,6]);put(['','Grises',T.gris]);put(['','Doppler',T.dop]);put([]);}
  if(T.sinValor){put([`${T.sinValor} ecografías sin valor definido (no incluidas en montos)`]);put([]);}
  put(['Desglose por día']);

  sel.list.forEach(e=>{const s=entryCalc(e);const d=isoToDate(e.date);put([`${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`,cap(DIAS[d.getDay()]),centro(e.cid).nombre,e.horas||'',detailText(e.counts),s.gris,s.dop,s.total,s.bruto,s.ret,s.liq],[8,9,10]);});
  const ws=XLSX.utils.aoa_to_sheet(aoa);
  moneyCells.forEach(([r,c])=>{const a=XLSX.utils.encode_cell({r,c});if(ws[a]&&typeof ws[a].v==='number')ws[a].z='"$"#,##0';});
  ws['!cols']=[{wch:22},{wch:36},{wch:22},{wch:18},{wch:40},{wch:12},{wch:12},{wch:9},{wch:13},{wch:13},{wch:13}];
  const head=['Fecha','Centro','Horas',...EXAMS.map(e=>e.n),'Grises','Doppler','Total','Bruto','Retención','Líquido'];
  const rows=[head];
  sel.list.forEach(e=>{const s=entryCalc(e);rows.push([e.date,centro(e.cid).nombre,e.horas||'',...EXAMS.map(x=>e.counts[x.id]||0),s.gris,s.dop,s.total,s.bruto,s.ret,s.liq]);});

  return new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
function buildCasuWorkbook(){

  const ws=XLSX.utils.aoa_to_sheet(aoa);

  ws['!cols']=[{wch:30},{wch:38},{wch:10},{wch:12},{wch:8}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Casuística');
  return{blob:new Blob([XLSX.write(wb,{bookType:'xlsx',type:'array'})]),name:`casuistica_ecografia_${from}_a_${to}.xlsx`};
}
async function saveFile(filename,data){
  const blob=data instanceof Blob?data:new Blob([data],{type:filename.endsWith('.json')?'application/json':'text/plain'});
  try{const file=new File([blob],filename,{type:blob.type||'application/octet-stream'});
    if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return true;}}
  catch(e){if(e&&e.name==='AbortError')return false;}
  try{const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);return true;}
  catch(e){toast('No se pudo descargar el archivo','err');return false;}
}

let imp=null;
function openImport(){

  <p class="note">Acepta .xlsx, .xls o .csv. Sirven dos formatos: una fila por examen (fecha + descripción, opcionalmente cantidad) o una tabla por día con una columna por tipo de ecografía. Solo se guardan fechas y conteos: nombres, RUT u otros datos del archivo se ignoran.</p>
  <div class="field"><label class="btn primary">Elegir archivo<input type="file" id="impFile" accept=".xlsx,.xls,.csv" hidden></label> <span id="impName" class="note"></span></div>
  <div id="impBody"></div>`,true);

    catch(e){console.error(e);$('#impBody').innerHTML='<p class="warn">No se pudo leer el archivo. Verifica que sea un Excel o CSV válido.</p>';}};
}
function analyzeSheet(){
  const ws=imp.wb.Sheets[imp.sheet];
  const rows=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:''});
  imp.rows=rows;imp.ncol=rows.reduce((m,r)=>Math.max(m,r.length),0);
  let h=0;for(let i=0;i<Math.min(rows.length,25);i++){const r=rows[i];const strs=r.filter(v=>typeof v==='string'&&v.trim()&&!parseDate(v)).length;const filled=r.filter(v=>v!==''&&v!=null).length;if(filled>=2&&strs>=Math.max(2,filled*0.6)){h=i;break;}}
  imp.header=h;
  const heads=(rows[h]||[]).map(v=>String(v??''));
  imp.heads=heads;
  const body=rows.slice(h+1,h+301);
  const dateScore=c=>body.reduce((a,r)=>a+(parseDate(r[c])?1:0),0)+(/fecha|date|dia/i.test(heads[c]||'')?3:0);
  const recScore=c=>body.reduce((a,r)=>a+(typeof r[c]==='string'&&recognize(r[c])?1:0),0);
  let best=-1,bs=0;for(let c=0;c<imp.ncol;c++){const s=dateScore(c);if(s>bs){bs=s;best=c;}}imp.colDate=best;
  let be=-1,bes=0;for(let c=0;c<imp.ncol;c++){if(c===best)continue;const s=recScore(c);if(s>bes){bes=s;be=c;}}
  if(be<0){let ml=0;for(let c=0;c<imp.ncol;c++){if(c===best)continue;const l=body.reduce((a,r)=>a+(typeof r[c]==='string'?r[c].length:0),0);if(l>ml){ml=l;be=c;}}}
  imp.colExam=be;
  imp.colQty=-1;for(let c=0;c<imp.ncol;c++){if(/cant|n°|nº|numero|qty|unidades/i.test(heads[c]||'')&&body.some(r=>isFinite(toNum(r[c]))&&toNum(r[c])>0)){imp.colQty=c;break;}}
  const recHeads=heads.map((x,c)=>c!==best&&recognize(x)?c:-1).filter(c=>c>=0);
  imp.mode=recHeads.length>=2?'matriz':'filas';
  imp.map={};
}
function colLabel(c){const h=imp.heads[c];return `${XLSX.utils.encode_col(c)}${h?` · ${String(h).slice(0,30)}`:''}`;}
function colOptions(sel,allowNone,noneLabel){let o=allowNone?`<option value="-1" ${sel===-1?'selected':''}>${noneLabel}</option>`:'';for(let c=0;c<imp.ncol;c++)o+=`<option value="${c}" ${sel===c?'selected':''}>${esc(colLabel(c))}</option>`;return o;}
function examOptions(sel){return `<option value="" ${!sel?'selected':''}>Ignorar</option><optgroup label="Escala de grises">${GRIS.map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.n)}</option>`).join('')}</optgroup><optgroup label="Doppler">${DOP.map(e=>`<option value="${e.id}" ${sel===e.id?'selected':''}>${esc(e.n)}</option>`).join('')}</optgroup>`;}
function autoGuess(text){const k=norm(text);if(Store.alias[k]!==undefined)return Store.alias[k]||'';return recognize(text)||'';}
function computeImport(){
  const res={byDate:{},total:0,skippedDate:0,uniques:{}};
  const rows=imp.rows.slice(imp.header+1);
  const add=(date,eid,n)=>{const d=res.byDate[date]||(res.byDate[date]={});d[eid]=(d[eid]||0)+n;res.total+=n;};
  rows.forEach(r=>{
    if(!r||!r.some(v=>v!==''&&v!=null))return;
    const date=imp.fixedDate||(imp.colDate>=0?parseDate(r[imp.colDate]):null);
    if(imp.mode==='filas'){
      const desc=imp.colExam>=0?String(r[imp.colExam]??'').trim():'';if(!desc)return;
      const k=norm(desc);let n=imp.colQty>=0?toNum(r[imp.colQty]):1;if(!isFinite(n))n=1;n=Math.round(n);if(n<=0)return;
      const u=res.uniques[k]||(res.uniques[k]={k,desc,n:0,guess:autoGuess(desc)});u.n+=n;
      const eid=imp.map[k]!==undefined?imp.map[k]:u.guess;
      if(!date){res.skippedDate+=n;return;}
      if(eid)add(date,eid,n);
    }else{
      for(let c=0;c<imp.ncol;c++){if(c===imp.colDate)continue;const eid=imp.map['c'+c]!==undefined?imp.map['c'+c]:autoGuess(imp.heads[c]);if(!eid)continue;const n=Math.round(toNum(r[c]));if(!(n>0))continue;if(!date){res.skippedDate+=n;continue;}add(date,eid,n);}
    }
  });
  return res;
}
function renderImport(){
  const res=computeImport();
  const dates=Object.keys(res.byDate).sort();
  const existing=dates.filter(d=>Store.get(imp.cid,d)).length;
  let mapping='';
  if(imp.mode==='filas'){
    const us=Object.values(res.uniques).sort((a,b)=>b.n-a.n);
    const unrec=us.filter(u=>!(imp.map[u.k]!==undefined?imp.map[u.k]:u.guess)).length;
    mapping=`<h3>Descripciones encontradas (${us.length})</h3>${unrec?`<p class="warn">${unrec} sin reconocer: asígnalas o quedarán fuera.</p>`:''}
    <div class="tbl-wrap"><table><thead><tr><th>Descripción en el Excel</th><th class="num">Cant.</th><th>Se registra como</th></tr></thead><tbody>
    ${us.map(u=>{const v=imp.map[u.k]!==undefined?imp.map[u.k]:u.guess;return `<tr><td style="white-space:normal">${esc(u.desc)}</td><td class="num">${u.n}</td><td><select class="map ${v?'':'none'}" data-map="${esc(u.k)}">${examOptions(v)}</select></td></tr>`;}).join('')}
    </tbody></table></div>`;
  }else{
    const cols=[];for(let c=0;c<imp.ncol;c++)if(c!==imp.colDate)cols.push(c);
    mapping=`<h3>Columnas del Excel</h3><div class="tbl-wrap"><table><thead><tr><th>Columna</th><th>Se registra como</th></tr></thead><tbody>
    ${cols.map(c=>{const v=imp.map['c'+c]!==undefined?imp.map['c'+c]:autoGuess(imp.heads[c]);return `<tr><td>${esc(colLabel(c))}</td><td><select class="map ${v?'':'none'}" data-map="c${c}">${examOptions(v)}</select></td></tr>`;}).join('')}
    </tbody></table></div>`;
  }
  const byG={gris:0,dop:0};Object.values(res.byDate).forEach(d=>{for(const[k,n]of Object.entries(d))EX[k].g==='gris'?byG.gris+=n:byG.dop+=n;});
  $('#impBody').innerHTML=`
  <div class="row3">
    ${imp.wb.SheetNames.length>1?`<div class="field"><label class="f" for="impSheet">Hoja</label><select id="impSheet">${imp.wb.SheetNames.map(s=>`<option ${s===imp.sheet?'selected':''}>${esc(s)}</option>`).join('')}</select></div>`:''}
    <div class="field"><label class="f" for="impC">Importar al centro</label><select id="impC">${Store.centros.map(c=>`<option value="${c.id}" ${c.id===imp.cid?'selected':''}>${esc(c.nombre)}</option>`).join('')}</select></div>
    <div class="field"><label class="f">Formato</label><div class="seg"><label><input type="radio" name="impMode" value="filas" ${imp.mode==='filas'?'checked':''}>Fila por examen</label><label><input type="radio" name="impMode" value="matriz" ${imp.mode==='matriz'?'checked':''}>Tabla por día</label></div></div>
  </div>
  <div class="row3">
    <div class="field"><label class="f" for="impDate">Columna de fecha</label><select id="impDate">${colOptions(imp.fixedDate?-1:imp.colDate,true,'Usar una fecha fija')}</select></div>
    ${imp.fixedDate||imp.colDate<0?`<div class="field"><label class="f" for="impFixed">Fecha fija</label><input type="date" id="impFixed" value="${imp.fixedDate}"></div>`:''}
    ${imp.mode==='filas'?`<div class="field"><label class="f" for="impExam">Columna de examen</label><select id="impExam">${colOptions(imp.colExam,false)}</select></div>
    <div class="field"><label class="f" for="impQty">Columna de cantidad</label><select id="impQty">${colOptions(imp.colQty,true,'Ninguna (1 por fila)')}</select></div>`:''}
  </div>
  <div class="field"><label class="f">Si un día ya tiene registros</label><div class="seg"><label><input type="radio" name="impMerge" value="sumar" ${imp.merge==='sumar'?'checked':''}>Sumar</label><label><input type="radio" name="impMerge" value="reemplazar" ${imp.merge==='reemplazar'?'checked':''}>Reemplazar el día</label></div></div>
  ${mapping}
  <div class="modal-foot">
    <span><span class="sum">${res.total} ecografías · ${dates.length} días</span> <span class="note">(${byG.gris} grises, ${byG.dop} Doppler${dates.length?` · ${shortDay(dates[0])} a ${shortDay(dates[dates.length-1])}`:''})</span>
      ${res.skippedDate?`<br><span class="warn">${res.skippedDate} sin fecha válida, se omiten.</span>`:''}${existing?`<br><span class="note">${existing} ${existing===1?'día ya tenía':'días ya tenían'} registros en este centro.</span>`:''}</span>
    <span><button class="btn" data-act="close">Cancelar</button> <button class="btn primary" data-act="doImport" ${res.total?'':'disabled'}>Importar ${res.total} ecografías</button></span>
  </div>`;
  const b=$('#impBody');
  b.querySelector('#impSheet')?.addEventListener('change',e=>{imp.sheet=e.target.value;analyzeSheet();renderImport();});
  b.querySelector('#impC').onchange=e=>{imp.cid=e.target.value;renderImport();};
  b.querySelectorAll('[name=impMode]').forEach(r=>r.onchange=e=>{imp.mode=e.target.value;imp.map={};renderImport();});
  b.querySelectorAll('[name=impMerge]').forEach(r=>r.onchange=e=>{imp.merge=e.target.value;});
  b.querySelector('#impDate').onchange=e=>{const v=+e.target.value;if(v<0){imp.fixedDate=imp.fixedDate||todayISO();}else{imp.fixedDate='';imp.colDate=v;}renderImport();};
  b.querySelector('#impFixed')?.addEventListener('change',e=>{imp.fixedDate=e.target.value;renderImport();});
  b.querySelector('#impExam')?.addEventListener('change',e=>{imp.colExam=+e.target.value;imp.map={};renderImport();});
  b.querySelector('#impQty')?.addEventListener('change',e=>{imp.colQty=+e.target.value;renderImport();});
  b.querySelectorAll('select[data-map]').forEach(s=>s.onchange=e=>{imp.map[e.target.dataset.map]=e.target.value;renderImport();});
}
function doImport(){
  const res=computeImport();
  for(const[date,counts]of Object.entries(res.byDate)){
    let c=counts;if(imp.merge==='sumar'){const ex=Store.get(imp.cid,date);if(ex){c={...ex};for(const[k,n]of Object.entries(counts))c[k]=(c[k]||0)+n;}}
    Store.setDay(imp.cid,date,c);
  }
  if(imp.mode==='filas'){for(const[k,v]of Object.entries(imp.map)){const auto=recognize(res.uniques[k]?.desc||'')||'';if(v!==auto)Store.setAlias(k,v);else if(Store.alias[k]!==undefined)Store.delAlias(k);}}
  else{for(const[k,v]of Object.entries(imp.map)){const c=+k.slice(1);const t=norm(imp.heads[c]);if(!t)continue;const auto=recognize(imp.heads[c])||'';if(v!==auto)Store.setAlias(t,v);}}
  const dates=Object.keys(res.byDate).sort();
  closeModal();if(dates.length)ui.ym=dates[dates.length-1].slice(0,7);ui.tab='inicio';Store.commit();
  toast(`Importadas ${res.total} ecografías en ${dates.length} días`);
}

    case 'sync':Sync.run(true);break;
    case 'saveSync':saveSync();break;
    case 'unlink':confirmModal('Desconectar este dispositivo','Tus datos se quedan en este dispositivo y en la hoja, pero dejarán de sincronizarse aquí.','Desconectar',()=>{Store.settings.url='';Store.settings.token='';Store.cursor=0;Store.persist();Sync.state='idle';render();});break;
    case 'copyCode':copyText(linkCode(),'Código copiado');break;
    case 'useCode':useCode();break;
    case 'copyUrl':copyText(Store.settings.url,'Dirección copiada');break;
    case 'copyToken':copyText(Store.settings.token,'Token copiado');break;
    case 'copyExams':copyText(EXAMS.map(e=>e.n).join('\n'),'Lista de exámenes copiada');break;
    case 'copyCenters':copyText(Store.centros.map(c=>c.nombre).join('\n'),'Lista de centros copiada');break;
    case 'resetTasas':Store.setTasas({...TASAS_DEF});Store.commit();toast('Tasas restablecidas');break;
    case 'checkUpdate':Upd.check(true);break;
    case 'applyUpdate':Upd.apply();break;
    case 'backup':doBackup();break;
    case 'exportAll':exportAll();break;
    case 'resync':Store.cursor=0;Store.persist();Sync.run(true);break;
    case 'wipe':confirmModal('Empezar de cero',`Se borrarán todos tus centros, tarifas y días${Sync.configured()?' en este dispositivo, en la hoja y en tus otros dispositivos':''}. Te recomendamos exportar tus datos antes.`,'Borrar todo',()=>{Store.wipe();ui.cid='all';ui.valCid=null;Store.commit();toast('Datos borrados');},'BORRAR');break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='diasYm'){ui.diasYm=t.value;render();}
  else if(t.id==='caFrom'){ui.caFrom=t.value;t.blur();render();}
  else if(t.id==='caTo'){ui.caTo=t.value;t.blur();render();}
  else if(t.id==='restoreFile'&&t.files[0]){doRestore(t.files[0]);t.value='';}
  else if(t.id==='cBoleta'){const c=clone(centro(ui.valCid));c.boleta=t.checked;Store.saveCenter(c);t.blur();Store.commit();toast(t.checked?'Se descontará la retención en este centro':'Este centro ya no descuenta retención');}
  else if(t.id==='copyFrom'&&t.value){const src=centro(t.value);const pr=src.tarifas[tarifaIdx(src,todayISO())].precios;const f=$('#pricesForm');EXAMS.forEach(ex=>{const p=pr[ex.id];f.elements[ex.id].value=p!=null?intFmt.format(p):'';});toast(`Valores copiados de ${src.nombre}. Revisa y guarda.`);}
  else if(t.name==='theme'){Store.settings.theme=t.value;Store.persist();applyTheme();}
});
document.addEventListener('submit',e=>{if(e.target.id==='pricesForm'){e.preventDefault();savePrices(e.target);}else if(e.target.id==='tasasForm'){e.preventDefault();saveTasas(e.target);}});
document.addEventListener('focusout',e=>{
  const t=e.target;
  if(t.classList&&t.classList.contains('price')){const n=Math.round(toNum(t.value.replace(/\$/g,'')));if(t.value.trim()&&isFinite(n))t.value=intFmt.format(n);}
  setTimeout(()=>{if(ui.needsRender&&!modalOpen()){const a=document.activeElement;if(!(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)))render();}},0);
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalOpen()){closeModal();return;}
  if(!(e.metaKey||e.ctrlKey)||modalOpen())return;
  const inField=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  const k=e.key.toLowerCase();
  if(k==='n'){e.preventDefault();openRegistro();}
  else if(k==='r'){e.preventDefault();Sync.run(true);}
  else if(k==='e'){e.preventDefault();openExport();}
  else if(k==='i'){e.preventDefault();openImport();}
  else if(/^[1-5]$/.test(k)){e.preventDefault();ui.tab=TABS[+k-1][0];render();}
  else if(!inField&&(k==='arrowleft'||k==='arrowright')&&ui.tab==='inicio'){e.preventDefault();ui.ym=shiftYM(ui.ym,k==='arrowleft'?-1:1);render();}
});

/* ---------- Arranque ---------- */
Store.load();applyTheme();render();
window.addEventListener('online',()=>{Sync.run(false);renderStatus();});
window.addEventListener('offline',()=>{Sync.state='offline';renderStatus();});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-(Store.settings.lastSync||0)>60000)Sync.run(false);});
setInterval(()=>Sync.run(false),15*60*1000);
Sync.run(false);
if(navigator.onLine)Upd.check(false);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
if(navigator.storage&&navigator.storage.persist){navigator.storage.persist().catch(()=>{});}

</script>
</body>
</html>
